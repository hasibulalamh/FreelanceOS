allowBuilds:
  # Prisma client postinstall generates the client stub.
  '@prisma/client': true
  # Prisma engine binaries download + CLI postinstall.
  '@prisma/engines': true
  prisma: true
  # Prisma 7+ CLI loads prisma.config.* through esbuild.
  sharp: false
  unrs-resolver: false
  # Cloudflare Workers runtime — not used by this project.
  workerd: false
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8
